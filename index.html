<!DOCTYPE html>
<html lang="ru">
<head>
<link rel="preconnect" href="https://googleapis.com">
<link rel="preconnect" href="https://gstatic.com" crossorigin>
<link href="https://googleapis.com/css2?family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ksioko</title>
    <style>
        *::-webkit-scrollbar {
    display: none !important;
}

* {
    -ms-overflow-style: none !important;  /* IE и Edge */
    scrollbar-width: none !important;     /* Firefox */
}
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --btn-bg: #050505;
            --btn-hover: #0b0b0b;
        }
        body, a, p, span {
            font-family: 'Barlow', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 14px !important;
}
        }
        .profile {
            text-align: center;
            margin-bottom: 40px;
        }
        .avatar {
            width: 360px;
            height: 360px;
            border-radius: 0%;
            object-fit: cover;
            padding-top: 60px;
        }
        .links-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .link-btn {
            background-color: var(--btn-bg);
            color: var(--text-color);
            text-decoration: none;
            padding: 16px;
            border-radius: 8px;
            text-align: center;
            font-weight: 300;
            transition: background-color 0.2s ease, transform 0.1s ease;
            border: 1px solid #0b0b0b;
        }
        .link-btn:hover {
            background-color: var(--btn-hover);
            transform: scale(1.02);
        }
    </style>
</head>
<body>

    <div class="profile">
        <img class="avatar" src="logo.png" alt="Аватар">
    </div>

    <div class="links-container">
        <a href="https://t.me/ksioko" class="link-btn" target="_blank">Telegram</a>
        <a href="https://youtube.com/@ksioko" class="link-btn" target="_blank">YouTube</a>
        <a href="https://soundcloud.com/ksioko" class="link-btn" target="_blank">SoundCloud</a>
    </div>

</body>
</html>
