<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои ссылки | Bio Link</title>
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --btn-bg: #1f1f1f;
            --btn-hover: #333333;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .profile {
            text-align: center;
            margin-bottom: 30px;
        }
        .avatar {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #fff;
        }
        .name {
            font-size: 20px;
            font-weight: bold;
            margin: 10px 0 5px 0;
        }
        .bio {
            font-size: 14px;
            color: #aaaaaa;
        }
        .links-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .link-btn {
            background-color: var(--btn-bg);
            color: var(--text-color);
            text-decoration: none;
            padding: 16px;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            transition: background-color 0.2s ease, transform 0.1s ease;
            border: 1px solid #2d2d2d;
        }
        .link-btn:hover {
            background-color: var(--btn-hover);
            transform: scale(1.02);
        }
    </style>
</head>
<body>

    <div class="profile">
        <!-- Замените URL на фото или оставьте стандартную заглушку -->
        <img class="avatar" src="https://placeholder.com" alt="Аватар">
        <div class="name">Ваше Имя / Никнейм</div>
        <div class="bio">Короткое описание (кто вы, чем занимаетесь)</div>
    </div>

    <div class="links-container">
        <!-- Скопируйте или удалите строки ниже для настройки своих ссылок -->
        <a href="https://t.me/ksioko" class="link-btn" target="_blank">Telegram</a>
        <a href="https://soundcloud.com" class="link-btn" target="_blank">SoundCloud</a>
        <a href="https://vk.com" class="link-btn" target="_blank">ВКонтакте</a>
    </div>

</body>
</html>
